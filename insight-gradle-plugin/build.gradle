plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'com.gradleup.shadow' version '9.2.2'
}

dependencies {
    implementation project(':insight-analyzer-core')
    implementation project(':insight-diagnosis')
    implementation project(':insight-report')
    implementation project(':insight-optimizer-redex')
    compileOnly 'com.android.tools.build:gradle:8.13.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

gradlePlugin {
    website = 'https://github.com/spuermax/Android-Insight'
    vcsUrl = 'https://github.com/spuermax/Android-Insight'

    plugins {
        androidInsight {
            id = 'io.github.spuermax.androidinsight'
            implementationClass = 'io.github.androidinsight.gradle.AndroidInsightPlugin'
            displayName = 'Android Insight'
            description = 'Analyze Android APK build artifacts, diagnose packaging issues, and generate optimization reports.'
            tags.set(['android', 'apk', 'analysis', 'optimization', 'performance'])
            compatibility(it) {
                features {
                    configurationCache = false
                }
            }
        }

    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ''
}